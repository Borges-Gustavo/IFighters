<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFighters</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<section class="screen intro active" data-screen="intro"><video id="game-intro" preload="auto" playsinline muted><source src="img/game/Game%20Intro.mp4" type="video/mp4"></video></section>
<section class="screen opening" data-screen="opening"><img class="opening-logo" src="img/game/Logo%20.png" alt="IFighters"><b class="demo">DEMO</b><img class="opening-fighter" src="img/sprites/Coelho%20Cinderace%20.png" alt="IFighter"><button class="start-button selectable" data-action="menu">press enter to start</button></section>
<section class="screen campus" data-screen="menu"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><div class="menu-panel reference-panel"><button class="menu-choice selectable" data-action="play">PLAY</button><button class="menu-choice selectable" data-action="ifdex">Pokedex</button><button class="menu-choice selectable" data-action="settings">Configuracao</button><button class="menu-choice selectable" data-action="credits">Creditos</button></div><div class="menu-trio"><img src="img/sprites/Lazzari%20bulbassauro%20.png" alt=""><img src="img/sprites/Arth%20Squirtle%20.png" alt=""><img src="img/sprites/Roque%20Charmander.png" alt=""></div><i class="orange-corner"></i></section>
<section class="screen campus" data-screen="play"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><div class="play-panel reference-panel"><button class="menu-choice selectable" data-action="single">Singleplayer</button><button class="menu-choice selectable" data-action="multi">Multiplayer</button></div><img class="play-character" src="img/sprites/Laura%20Leafeon%20.png" alt="Laura"><i class="orange-corner"></i></section>
<section class="screen campus" data-screen="multiplayer"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><button class="back selectable" data-action="leave-room">VOLTAR</button><div class="room-panel reference-panel"><h1>Multiplayer</h1><div id="room-lobby"><button class="pixel-button selectable" data-action="create-room">CRIAR SALA</button><label>Codigo da sala<input id="room-code" maxlength="6" autocomplete="off"></label><button class="pixel-button selectable" data-action="join-room">ENTRAR</button></div><div id="room-wait" hidden><p id="room-status">Conectando...</p><p>CODIGO: <b id="room-code-display">------</b></p><button class="pixel-button selectable" data-action="copy-room">COPIAR CODIGO</button><button class="pixel-button selectable" data-action="leave-room">CANCELAR</button></div></div><i class="orange-corner"></i></section>
<section class="screen campus" data-screen="team"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><button class="back selectable" data-action="back">VOLTAR</button><div class="team-panel reference-panel"><h1>Escolha seu IFighter</h1><div id="fighter-list" class="fighter-list"></div></div><aside id="fighter-preview" class="team-preview reference-panel"></aside><button class="confirm selectable" data-action="battle">CONFIRMAR</button></section>
<section class="screen campus" data-screen="ifdex"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><button class="back selectable" data-action="back">VOLTAR</button><div class="dex-panel reference-panel"><button class="dex-arrow selectable" data-action="dex-prev">&lt;</button><div id="ifdex-grid" class="ifdex-grid"></div><button class="dex-arrow selectable" data-action="dex-next">&gt;</button></div><aside id="dex-detail" class="dex-detail reference-panel"></aside><i class="orange-corner"></i></section>
<section class="screen campus" data-screen="settings"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><button class="back selectable" data-action="back">VOLTAR</button><div class="settings-panel reference-panel"><h1>Configuracao</h1><p><kbd>UP DOWN / W S</kbd><b>Navegar</b></p><p><kbd>ENTER / TOQUE</kbd><b>Confirmar</b></p><p><kbd>ESC / BACKSPACE</kbd><b>Voltar</b></p><label><input id="animations-toggle" type="checkbox"> <b>Animacoes</b></label><label><input id="contrast-toggle" type="checkbox"> <b>Alto contraste</b></label><label><input id="intro-toggle" type="checkbox"> <b>Reproduzir intro ao abrir</b></label><button class="pixel-button selectable" data-action="replay-intro">REVER INTRO</button></div><i class="orange-corner"></i></section>
<section class="screen campus" data-screen="credits"><img class="corner-logo" src="img/game/Logo%20.png" alt="IFighters"><button class="back selectable" data-action="back">VOLTAR</button><div class="credits-panel reference-panel"><h1>Creditos</h1><p>IFIGHTERS</p><p>Projeto criado com a comunidade IFRS.</p><p>Sprites, cenario e Game Intro: acervo do projeto.</p></div></section>
<section class="screen battle" data-screen="battle"><button class="back selectable" data-action="quit">SAIR</button><div id="enemy-card" class="hp-card"></div><img id="enemy-sprite" class="battle-sprite enemy" alt=""><img id="player-sprite" class="battle-sprite player" alt=""><div id="player-card" class="hp-card player-card"></div><div class="battle-box"><p id="battle-message"></p><div id="move-list" class="move-list"></div></div><div id="battle-result" class="result reference-panel" hidden><h1 id="result-title"></h1><p id="result-text"></p><button class="pixel-button selectable" data-action="restart">REVANCHE</button><button class="pixel-button selectable" data-action="quit">MENU</button></div></section><div id="notice" hidden></div></main><script src="data.js"></script><script src="protocol.js"></script><script src="app.js"></script></body></html>
